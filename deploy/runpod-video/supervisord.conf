[supervisord]
nodaemon=true
logfile=/data/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/run/supervisord.pid
[unix_http_server]
file=/run/supervisor.sock
chmod=0700
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c max_connections=40 -c shared_buffers=256MB
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/data/logs/postgres.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
[program:api]
command=/app/.venv/bin/python /app/deploy/runpod-video/launch.py api
directory=/app
user=audigo
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
[program:worker]
command=/app/.venv/bin/python /app/deploy/runpod-video/launch.py worker
directory=/app
user=audigo
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
stdout_logfile=/data/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
[program:backup]
command=/app/.venv/bin/python /app/deploy/runpod-video/launch.py backup
directory=/app
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/backup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
[program:ssh]
command=/usr/sbin/sshd -D -e
priority=15
autorestart=true
stdout_logfile=/data/logs/ssh.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
