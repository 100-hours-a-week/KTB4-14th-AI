[project]
name = "audigo-ai-api"
version = "0.1.0"
description = "Audigo AI service API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "celery[redis]==5.6.3",
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "numpy>=2.2,<3",
  "onnxruntime>=1.23,<2",
  "pydantic==2.11.9",
  "pymysql[rsa]==1.1.2",
  "python-dotenv==1.1.1",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]==0.36.0",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
  "fakeredis[lua]>=2.31,<3",
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
