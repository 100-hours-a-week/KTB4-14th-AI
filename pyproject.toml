[project]
name = "audigo-ai-api"
version = "0.1.0"
description = "Audigo AI service API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "uvicorn[standard]==0.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
