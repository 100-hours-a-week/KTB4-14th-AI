services:
  video-db:
    image: postgres:17
    environment:
      POSTGRES_DB: audigo_video
      POSTGRES_USER: audigo
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD:?Set VIDEO_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - video_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audigo -d audigo_video"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  video_db_data:
