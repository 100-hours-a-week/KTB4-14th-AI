name: AI PR CI

on:
  pull_request:
    branches: [ai-develop]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ai-ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # ARM64 이미지를 직접 빌드하므로 QEMU 에뮬레이션이 불필요
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # checkout 이후 Git 명령용 인증 정보를 유지하지 않음

      - name: 도커 빌드 환경 세팅
        uses: docker/setup-buildx-action@v4

      - name: 도커 이미지 빌드 테스트 실행
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false # 빌드 '테스트'만 진행
          tags: audigo-ai:ci-test
          # 러너(GitHub Actions) 캐시에 레이어를 저장/재사용해 PR마다 반복 빌드 시간을 단축
          cache-from: type=gha
          cache-to: type=gha,mode=max